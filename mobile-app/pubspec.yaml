name: biometricsauth
description: Biometric authentication sample mobile application.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # WebView with JavaScript bridge support
  flutter_inappwebview: ^6.1.5
  # Check biometric availability (stable, official plugin)
  local_auth: ^2.3.0
  # Hardware-backed biometric signing (Secure Enclave / StrongBox)
  biometric_signature: ^11.1.0
  # Secure storage for tokens and keys
  flutter_secure_storage: ^9.2.4
  # HTTP client for API calls
  http: ^1.3.0
  # URL launcher for external links
  url_launcher: ^6.3.1
  # Logging
  logger: ^2.5.0
  # Environment variables
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true